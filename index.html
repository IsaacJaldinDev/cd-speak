<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Isaac Jaldin — Software Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/launchdarkly-js-client-sdk@3/dist/ldclient.min.js"></script>
</head>
<body>
  <main id="profile" class="profile">
    <section class="profile-hero">
      <div class="avatar">IJ</div>
      <h1>Isaac Jaldin</h1>
      <p class="role">Software Engineer</p>
      <p class="tagline">Shipping software with AI, on the cloud, at speed.</p>
      <div class="stack">
        <span class="chip">AI</span>
        <span class="chip">Node.js</span>
        <span class="chip">.NET</span>
        <span class="chip">Angular</span>
        <span class="chip">React</span>
        <span class="chip">AWS</span>
      </div>
      <div class="cta">
        <a href="#" class="btn primary">View portfolio</a>
        <a href="#" class="btn ghost">Get in touch</a>
      </div>
    </section>
  </main>

  <div id="chaos" class="chaos" aria-hidden="false">
    <header class="chaos-header">
      <span class="dot"></span>
      <span class="chaos-title">BUILD FAILED</span>
      <span class="sep">|</span>
      <span class="chaos-meta">Errors: <span id="chaos-count">000</span></span>
      <span class="sep">|</span>
      <span class="chaos-meta" id="chaos-time">--:--:--</span>
      <span class="sep">|</span>
      <span class="chaos-meta">nx run web:build --prod</span>
    </header>
    <div class="chaos-log" id="chaos-log"></div>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
